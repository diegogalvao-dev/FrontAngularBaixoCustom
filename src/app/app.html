<div class="main-wrapper" [class.collapsed]="isLeftSidebarCollapsed()" [class.is-admin]="isAdmin()">

  @if (isAdmin()) {
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="brand-title">Luthier Studio</div>
      </div>
      <div class="top-bar-actions">
        <button class="icon-btn"><i class="fa-solid fa-bell"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-gear"></i></button>
        <div class="user-profile">
          <i class="fa-solid fa-user-circle"></i>
        </div>
      </div>
    </header>

    <app-left-side-bar [isLeftSidebarCollapsed]="isLeftSidebarCollapsed()"
      (changeIsLeftSidebarCollapsed)="changeIsLeftSidebarCollapsed($event)">
    </app-left-side-bar>
  }

  <div class="content-area">
    <div [class.router-outlet]="isAdmin()">
      <router-outlet></router-outlet>
    </div>
    
    @if (isAdmin()) {
      <!-- Global Footer -->
      <footer class="main-footer">
        <div class="footer-content">
          <div class="footer-left">
            <div class="footer-brand">
              <span class="brand-text">Luthier Studio</span>
              <span class="brand-tagline">Crafting Perfection</span>
            </div>
            <p class="copyright">© 2026 Luthier Studio. Todos os direitos reservados.</p>
          </div>
          
          <div class="footer-right">
            <div class="social-links">
              <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
              <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
              <a href="#" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
            </div>
            <nav class="footer-nav">
              <a href="#">Privacidade</a>
              <a href="#">Termos</a>
              <a href="#">Suporte</a>
            </nav>
          </div>
        </div>
      </footer>
    }
  </div>

</div>
