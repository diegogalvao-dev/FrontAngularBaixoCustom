<mat-form-field appearance="outline" class="flex-container">
  <mat-label>Pesquisar</mat-label>
  <input matInput (keyup.enter)="searchByName(input.value)" placeholder="Ex. Cabo" #input>
  <button mat-icon-button matSuffix aria-label="Pesquisar" (click)="searchByName(input.value)">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- id Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let obj"> {{obj.id}} </td>
  </ng-container>

    <!-- name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> name </th>
    <td mat-cell *matCellDef="let obj"> {{obj.name}} </td>
  </ng-container>

  <!-- acessorioTipo Column -->
  <ng-container matColumnDef="acessorioTipo">
    <th mat-header-cell *matHeaderCellDef> tipo </th>
    <td mat-cell *matCellDef="let obj"> {{obj.acessorioTipo}} </td>
  </ng-container>

  <!-- material Column -->
  <ng-container matColumnDef="material">
    <th mat-header-cell *matHeaderCellDef> Material </th>
    <td mat-cell *matCellDef="let obj"> {{obj.material}} </td>
  </ng-container>

  <!-- tamanho Column -->
  <ng-container matColumnDef="tamanho">
    <th mat-header-cell *matHeaderCellDef> Tamanho </th>
    <td mat-cell *matCellDef="let obj"> {{obj.tamanho}} </td>
  </ng-container>

    <!-- price Column -->
  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> Preço </th>
    <td mat-cell *matCellDef="let obj"> {{obj.price}} </td>
  </ng-container>

    <!-- quantidadeEstoque Column -->
  <ng-container matColumnDef="estoque">
    <th mat-header-cell *matHeaderCellDef> Estoque </th>
    <td mat-cell *matCellDef="let obj"> {{obj.estoque}} </td>
  </ng-container>

    <!-- fornecedor Column -->
  <ng-container matColumnDef="fornecedor">
    <th mat-header-cell *matHeaderCellDef> Fornecedor </th>
    <td mat-cell *matCellDef="let obj"> {{obj.fornecedor}} </td>
  </ng-container>

   <!-- Acao Column -->
  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef> Ação </th>
    <td mat-cell *matCellDef="let obj">  
        <button matIconButton
            color="primary"
            routerLink="/acessorios/edit/{{obj.id}}">
            <mat-icon>edit</mat-icon>
        </button>
        <button matIconButton
            color="warm"
            (click)="excluir(obj.id)">
            <mat-icon>delete</mat-icon>
        </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
  [pageIndex]="page"
  [pageSizeOptions]="[2,4,8,16]"
  [pageSize]="pageSize"
  [length]="totalRecords"
  (page)="paginar($event)">
</mat-paginator>
