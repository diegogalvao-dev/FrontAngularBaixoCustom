<div class="header-actions">
  <div class="search-container">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" (keyup.enter)="searchByName(input.value)" placeholder="Buscar produtos..." #input class="search-input" />
  </div>
  
  <button class="custom-btn" routerLink="/baixo/new">
    <i class="fa-solid fa-plus"></i>
    NOVO PRODUTO
  </button>
</div>

<table mat-table [dataSource]="dataSource" class="glass-table">


  <ng-container matColumnDef="imagem">
    <th mat-header-cell *matHeaderCellDef> IMAGEM </th>
    <td mat-cell *matCellDef="let obj">
      <div class="product-image-placeholder"></div>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> NOME DO PRODUTO </th>
    <td mat-cell *matCellDef="let obj" class="product-name"> {{obj.name}} </td>
  </ng-container>

  <ng-container matColumnDef="baixoModeloBase">
    <th mat-header-cell *matHeaderCellDef> CATEGORIA </th>
    <td mat-cell *matCellDef="let obj"> {{obj.baixoModeloBase}} </td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> PREÇO </th>
    <td mat-cell *matCellDef="let obj"> R$ {{obj.price}} </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> STATUS ESTOQUE </th>
    <td mat-cell *matCellDef="let obj">
      <span class="status-badge" [class.in-stock]="obj.quantidadeEstoque > 0"
        [class.out-of-stock]="obj.quantidadeEstoque <= 0">
        {{ obj.quantidadeEstoque > 0 ? 'Em Estoque' : 'Sem Estoque' }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef class="action-header"> AÇÕES </th>
    <td mat-cell *matCellDef="let obj">
      <div class="action-buttons">
        <button class="icon-btn-outline" routerLink="/baixo/edit/{{obj.id}}">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>
        <button class="icon-btn-outline danger" (click)="excluir(obj.id)">
          <i class="fa-regular fa-trash-can"></i>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="glass-row"></tr>
</table>

<!-- Custom Numbered Paginator -->
<div class="custom-pagination-container" *ngIf="totalPages > 0">
  <button class="pagination-btn nav-btn" [disabled]="page === 0" (click)="goToPage(page - 1)">
    Anterior
  </button>
  
  <div class="pagination-pages">
    <button *ngFor="let p of pages" 
            class="pagination-btn page-num" 
            [class.active]="p === page"
            (click)="goToPage(p)">
      {{ p + 1 }}
    </button>
  </div>

  <button class="pagination-btn nav-btn" [disabled]="page === totalPages - 1" (click)="goToPage(page + 1)">
    Próxima
  </button>
</div>
