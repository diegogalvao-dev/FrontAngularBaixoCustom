
<div class="searchAndCreate">

  <!--barra de pesquisa-->
  <div class="search-container">
    <span class="search-icon"> <i class="fa-solid fa-magnifying-glass" style="color: #012a5b;"></i> </span>
    <input
      type="text"
      (keyup.enter)="searchByName(input.value)" placeholder="Ex. Cabo" #input
      class="search-input"
    />
  </div>

  <!--botão de adicionar-->
  <button class="custom-btn" routerLink="/baixo/new">
    <span class="icon">+</span>
    Adicionar
  </button>

</div>


<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- id Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let obj"> {{obj.id}} </td>
  </ng-container>

  <!-- name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> name </th>
    <td mat-cell *matCellDef="let obj"> {{obj.name}} </td>
  </ng-container>

  <!-- baixoModeloBase Column -->
  <ng-container matColumnDef="baixoModeloBase">
    <th mat-header-cell *matHeaderCellDef> Modelo </th>
    <td mat-cell *matCellDef="let obj"> {{obj.baixoModeloBase}} </td>
  </ng-container>

  <!-- numeroCordas Column -->
  <ng-container matColumnDef="numeroCordas">
    <th mat-header-cell *matHeaderCellDef> Número de Cordas </th>
    <td mat-cell *matCellDef="let obj"> {{obj.numeroCordas}} </td>
  </ng-container>

  <!-- baixoCor Column -->
  <ng-container matColumnDef="baixoCor">
    <th mat-header-cell *matHeaderCellDef> Cor </th>
    <td mat-cell *matCellDef="let obj"> {{obj.baixoCor}} </td>
  </ng-container>

  <!-- price Column -->
  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> Preço </th>
    <td mat-cell *matCellDef="let obj"> {{obj.price}} </td>
  </ng-container>

  <!-- quantidadeEstoque Column -->
  <ng-container matColumnDef="quantidadeEstoque">
    <th mat-header-cell *matHeaderCellDef> Estoque </th>
    <td mat-cell *matCellDef="let obj"> {{obj.quantidadeEstoque}} </td>
  </ng-container>

  <!-- fornecedor Column -->
  <ng-container matColumnDef="fornecedor">
    <th mat-header-cell *matHeaderCellDef> Fornecedor </th>
    <td mat-cell *matCellDef="let obj"> {{obj.fornecedor}} </td>
  </ng-container>

  <!-- Acao Column -->
  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef> Ação </th>
    <td mat-cell *matCellDef="let obj">
      <button matIconButton color="primary" routerLink="/baixo/edit/{{obj.id}}">
        <mat-icon>edit</mat-icon>
      </button>
      <button class="buttonDelete" matIconButton color="warm" (click)="excluir(obj.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageIndex]="page" [pageSizeOptions]="[2,4,8,12]" [pageSize]="pageSize" [length]="totalRecords"
  (page)="paginar($event)">
</mat-paginator>
