<div class="form-container">
  <mat-card class="glass-card">
    <mat-card-header>
      <mat-card-title class="noir-title">
        {{ form.get('id')?.value ? 'EDITAR CAPTADOR' : 'NOVO CAPTADOR' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" class="noir-form">
        <div class="form-grid">
          <mat-form-field appearance="outline" class="glass-input">
            <mat-label>Marca</mat-label>
            <input matInput formControlName="marca" placeholder="Ex: EMG, Fender...">
            <mat-error *ngIf="form.get('marca')?.hasError('required')">Marca é obrigatória</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="glass-input">
            <mat-label>Preço</mat-label>
            <input matInput type="number" formControlName="price" placeholder="0.00">
            <span matPrefix>R$&nbsp;</span>
            <mat-error *ngIf="form.get('price')?.hasError('required')">Preço é obrigatório</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="glass-input">
            <mat-label>Posição</mat-label>
            <mat-select formControlName="captadorPosicao">
              <mat-option *ngFor="let opt of posicaoOptions" [value]="opt.value">
                {{ opt.label }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('captadorPosicao')?.hasError('required')">Posição é obrigatória</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="glass-input">
            <mat-label>Tipo</mat-label>
            <mat-select formControlName="type">
              <mat-option value="passivo">Passivo</mat-option>
              <mat-option value="ativo">Ativo</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Conditional Fields for Ativo -->
        <div *ngIf="form.get('type')?.value === 'ativo'" class="form-grid secondary-fields">
          <mat-slide-toggle formControlName="possuiBateria" class="glass-toggle">Possui Bateria?</mat-slide-toggle>
          <mat-slide-toggle formControlName="possuiAmplificador" class="glass-toggle">Possui Amplificador?</mat-slide-toggle>
        </div>

        <!-- Conditional Fields for Passivo -->
        <div *ngIf="form.get('type')?.value === 'passivo'" class="form-grid secondary-fields">
          <mat-form-field appearance="outline" class="glass-input">
            <mat-label>Resistência (kΩ)</mat-label>
            <input matInput type="number" formControlName="resistencia">
          </mat-form-field>

          <mat-form-field appearance="outline" class="glass-input">
            <mat-label>Número de Bobinas</mat-label>
            <input matInput type="number" formControlName="numeroBobinas">
          </mat-form-field>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="form-actions">
      <button class="custom-btn outline" routerLink="/captadores">CANCELAR</button>
      <button *ngIf="form.get('id')?.value" class="custom-btn danger" (click)="excluir()">EXCLUIR</button>
      <button class="custom-btn" (click)="salvar()">SALVAR CAPTADOR</button>
    </mat-card-actions>
  </mat-card>
</div>
