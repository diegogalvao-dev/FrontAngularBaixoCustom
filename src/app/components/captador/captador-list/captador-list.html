<div class="header-actions">
  <div class="search-container">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" (keyup.enter)="searchByName(input.value)" placeholder="Buscar captadores..." #input class="input-text search-input" />
  </div>
  
  <button class="custom-btn" routerLink="/captadores/new">
    <i class="fa-solid fa-plus"></i>
    NOVO CAPTADOR
  </button>
</div>

<table mat-table [dataSource]="dataSource" class="glass-table">

  <ng-container matColumnDef="marca">
    <th mat-header-cell *matHeaderCellDef> MARCA </th>
    <td mat-cell *matCellDef="let obj" class="product-name"> {{obj.marca}} </td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef> TIPO </th>
    <td mat-cell *matCellDef="let obj"> 
      <span class="status-badge" [class.in-stock]="obj.type === 'ativo'" [class.out-of-stock]="obj.type === 'passivo'">
        {{obj.type | titlecase}} 
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="posicao">
    <th mat-header-cell *matHeaderCellDef> POSIÇÃO </th>
    <td mat-cell *matCellDef="let obj"> {{obj.captadorPosicao}} </td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> PREÇO </th>
    <td mat-cell *matCellDef="let obj"> R$ {{obj.price | number:'1.2-2'}} </td>
  </ng-container>

  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef class="action-header"> AÇÕES </th>
    <td mat-cell *matCellDef="let obj">
      <div class="action-buttons">
        <button class="icon-btn-outline" routerLink="/captadores/edit/{{obj.id}}">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>
        <button class="icon-btn-outline danger" (click)="excluir(obj.id)">
          <i class="fa-regular fa-trash-can"></i>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="glass-row"></tr>
</table>

<!-- Custom Numbered Paginator -->
<div class="custom-pagination-container" *ngIf="totalPages > 0">
  <button class="pagination-btn nav-btn" [disabled]="page === 0" (click)="goToPage(page - 1)">
    Anterior
  </button>
  
  <div class="pagination-pages">
    <button *ngFor="let p of pages" 
            class="pagination-btn page-num" 
            [class.active]="p === page"
            (click)="goToPage(p)">
      {{ p + 1 }}
    </button>
  </div>

  <button class="pagination-btn nav-btn" [disabled]="page === totalPages - 1" (click)="goToPage(page + 1)">
    Próxima
  </button>
</div>
